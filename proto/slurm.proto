syntax = "proto3";

package slurm;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

// ============================================================
// Core Types
// ============================================================

message ResourceSet {
  uint32 cpus = 1;
  uint64 memory_mb = 2;
  repeated GpuResource gpus = 3;
  map<string, uint64> generic = 4;  // licenses, etc.
}

message AllocatedDevice {
  uint32 device_id = 1;
  uint64 count = 2;
}

message DeviceAllocations {
  repeated AllocatedDevice devices = 1;
}

message ResourceAllocations {
  uint32 cpus = 1;
  uint64 memory_mb = 2;
  map<string, DeviceAllocations> devices = 3;
}

message GpuResource {
  uint32 device_id = 1;
  string gpu_type = 2;       // "mi300x", "h100"
  uint64 memory_mb = 3;
  repeated uint32 peer_gpus = 4;
  GpuLinkType link_type = 5;
}

enum GpuLinkType {
  GPU_LINK_PCIE = 0;
  GPU_LINK_XGMI = 1;
  GPU_LINK_NVLINK = 2;
}

enum JobState {
  JOB_PENDING = 0;
  JOB_RUNNING = 1;
  JOB_COMPLETING = 2;
  JOB_COMPLETED = 3;
  JOB_FAILED = 4;
  JOB_CANCELLED = 5;
  JOB_TIMEOUT = 6;
  JOB_NODE_FAIL = 7;
  JOB_PREEMPTED = 8;
  JOB_SUSPENDED = 9;
  JOB_DEADLINE = 10;
  JOB_OUT_OF_MEMORY = 11;
  // Finalized end-of-run for an admin requeue; the job returns to PENDING.
  JOB_REQUEUED = 12;
}

enum NodeState {
  NODE_IDLE = 0;
  NODE_ALLOCATED = 1;
  NODE_MIXED = 2;
  NODE_DOWN = 3;
  NODE_DRAIN = 4;
  NODE_DRAINING = 5;
  NODE_ERROR = 6;
  NODE_UNKNOWN = 7;
  NODE_SUSPENDED = 8;
}

// A GPU resource request. `count` is interpreted per the field it populates
// on JobSpec: `gpus` = total across the job, `gpus_per_node` = per node,
// `gpus_per_task` = per task. `gpu_type` is optional (e.g. "mi300x").
message GpuRequest {
  uint32 count = 1;
  string gpu_type = 2;
}

message JobSpec {
  string name = 1;
  string partition = 2;
  string account = 3;
  string user = 4;
  uint32 uid = 5;
  uint32 gid = 6;

  // Resources
  uint32 num_nodes = 10;
  // 0 means unset: the controller defaults it to one task per node (num_nodes),
  // matching Slurm, rather than collapsing a multi-node request onto one node.
  uint32 num_tasks = 11;
  uint32 tasks_per_node = 12;
  uint32 cpus_per_task = 13;
  uint64 memory_per_node_mb = 14;
  uint64 memory_per_cpu_mb = 15;
  repeated string gres = 16;  // "gpu:mi300x:4"

  // GPU requests (mutually exclusive; at most one may be set). Distinct from
  // `gres` so the controller can tell "total across the job" (`gpus`) apart
  // from per-node/per-task counts. `--gres=gpu:N` continues to arrive via
  // `gres` and is normalized to `gpus_per_node` by the controller.
  GpuRequest gpus = 17;           // --gpus / -G: total across the whole job
  GpuRequest gpus_per_node = 18;  // --gpus-per-node
  GpuRequest gpus_per_task = 19;  // --gpus-per-task

  // Execution
  string script = 20;
  repeated string argv = 21;
  string work_dir = 22;
  string stdout_path = 23;
  string stderr_path = 24;
  map<string, string> environment = 25;
  string stdin_path = 26;

  // Time limits
  google.protobuf.Duration time_limit = 30;
  google.protobuf.Duration time_min = 31;

  // Scheduling hints
  string qos = 40;
  uint32 priority = 41;
  string reservation = 42;
  repeated string dependency = 43;  // "afterok:123,afterany:456"
  string nodelist = 44;             // "node[001-010]"
  string exclude = 45;
  string constraint = 46;       // "mi300x,nvlink" - required node features
  repeated string licenses = 47;  // "fluent:5", "matlab:1"

  // Notifications
  repeated string mail_type = 48;  // "BEGIN", "END", "FAIL", "ALL"
  string mail_user = 49;

  // Array
  string array_spec = 50;  // "0-99%10"

  // MPI
  string mpi = 51;            // MPI type: "none", "pmix"
  string distribution = 52;   // Task distribution: "block", "cyclic", "plane"
  uint32 het_group = 53;      // Heterogeneous job component index
  string burst_buffer = 54;   // Burst buffer directives ("stage_in:cmd;stage_out:cmd")
  google.protobuf.Timestamp begin_time = 55;   // Earliest eligible start time
  google.protobuf.Timestamp deadline = 56;     // Cancel if still pending after this
  bool spread_job = 57;                        // Spread across least-loaded nodes
  string open_mode = 58;                       // "truncate" or "append"
  string topology = 59;                        // Topology preference: "tree", "block", or empty

  // Misc
  bool requeue = 60;
  bool exclusive = 61;
  bool hold = 62;
  string comment = 63;
  string wckey = 64;
  bool interactive = 65;  // salloc interactive allocation

  // Kubernetes pod options
  bool host_network = 66;          // Enable host networking (RDMA/NCCL)
  bool privileged = 67;            // Run in privileged mode
  bool host_ipc = 68;              // Share host IPC namespace
  string shm_size = 69;            // Shared memory size (e.g., "64Gi")
  map<string, string> extra_resources = 80; // Custom device plugin resources
  repeated string script_args = 81;          // Positional args for the batch script ($1, $2, ...)

  // Container
  string container_image = 70;     // OCI image ref or squashfs path
  repeated string container_mounts = 71;  // "/src:/dst:ro" bind mounts
  string container_workdir = 72;   // Workdir inside container
  string container_name = 73;      // Named container (persists across jobs)
  bool container_readonly = 74;    // Read-only rootfs
  bool container_mount_home = 75;  // Bind-mount user home directory
  map<string, string> container_env = 76; // Extra env vars for container
  string container_entrypoint = 77; // Override entrypoint
  bool container_remap_root = 78;  // Remap user to root inside container

  // Standalone srun: reserve an allocation without launching a batch script;
  // the user command runs as a job step after nodes are registered.
  bool srun_job = 82;

  // Interactive PTY session (srun --pty)
  bool pty = 83;
  WindowSize initial_winsize = 84;

  // Submit command line as invoked, shell-quoted so word boundaries survive.
  // Client-asserted: the controller bounds and sanitizes it but cannot verify it.
  string submit_line = 85;
}

message JobInfo {
  uint32 job_id = 1;
  string name = 2;
  string user = 3;
  uint32 uid = 4;
  string partition = 5;
  string account = 6;
  JobState state = 7;
  string state_reason = 8;

  google.protobuf.Timestamp submit_time = 10;
  google.protobuf.Timestamp start_time = 11;
  google.protobuf.Timestamp end_time = 12;
  google.protobuf.Duration time_limit = 13;
  google.protobuf.Duration run_time = 14;

  uint32 num_nodes = 20;
  uint32 num_tasks = 21;
  uint32 cpus_per_task = 22;
  string nodelist = 23;
  string work_dir = 24;
  string command = 25;

  int32 exit_code = 30;
  string stdout_path = 31;
  string stderr_path = 32;
  int32 exit_signal = 33;       // Terminating signal of primary node (0 = none)
  int32 derived_exit_code = 34; // Running max over srun step exit codes (0 if no steps)
  string stdin_path = 35;

  ResourceAllocations resources = 40;
  uint32 priority = 41;
  string qos = 42;

  // Array jobs
  uint32 array_job_id = 50;
  uint32 array_task_id = 51;

  // Reservation
  string reservation = 52;

  string comment = 53;

  // True when standalone srun uses native step dispatch (not K8s batch fallback).
  // Requires a matching spur CLI: clients that ignore this field against a
  // step-dispatch controller will poll for batch completion while agents hold
  // allocation-only state.
  bool srun_step_dispatch = 54;

  // Requested GPUs (observability). `req_gpus` is the job total; `req_gpus_detail`
  // is a human summary such as "gpu:8" (total), "gpu:mi300x:4/node", or
  // "gpu:2/task".
  uint32 req_gpus = 55;
  string req_gpus_detail = 56;

  // Preemption provenance. Set when this job was preempted.
  // `preempted_by` is the job ID of the higher-priority job that caused the
  // preemption (0 when not preempted or unknown). `preempt_mode` is one of
  // "Requeue", "Cancel", or "Suspend". `preempt_qos` is the QOS name that
  // authorized the preemption under QosPriority type; empty for plain
  // priority-based preemption.
  uint32 preempted_by = 57;
  string preempt_mode = 58;
  string preempt_qos = 59;

  // Requested placement, as submitted. Distinct from `nodelist` (field 23),
  // the *allocated* list, which stays empty while the job is pending.
  string req_nodelist = 60;
  string exc_nodelist = 61;
  string features = 62;
  repeated string dependency = 63;

  string submit_line = 64;

  // Requested TRES ("cpu=8,mem=32000M,node=2,gres/gpu=8") and the per-node
  // minima Slurm reports alongside it.
  string req_tres = 65;
  uint32 min_cpus_node = 66;
  // Per-node memory floor. `min_memory_is_per_cpu` marks a --mem-per-cpu
  // request, which Slurm reports as MinMemoryCPU rather than MinMemoryNode.
  uint64 min_memory_node_mb = 67;

  // Earliest start (--begin, else submit), age-priority accrual start (from
  // submit even while held, unlike Slurm), and last scheduling evaluation.
  google.protobuf.Timestamp eligible_time = 68;
  google.protobuf.Timestamp accrue_time = 69;
  google.protobuf.Timestamp last_sched_eval = 70;

  google.protobuf.Timestamp deadline = 71;
  google.protobuf.Duration time_min = 72;
  bool requeue = 73;
  uint32 restarts = 74;
  bool batch_flag = 75;
  bool exclusive = 76;

  // Future slot the scheduler is holding for a pending job: when it projects
  // the job will start, and on which nodes. Unset when no slot is reserved.
  google.protobuf.Timestamp planned_start_time = 77;
  string sched_nodelist = 78;

  bool min_memory_is_per_cpu = 79;
}

message NodeInfo {
  string name = 1;
  NodeState state = 2;
  string state_reason = 3;
  repeated string partitions = 4;

  ResourceSet total_resources = 10;
  ResourceAllocations alloc_resources = 11;

  string arch = 20;
  string os = 21;
  uint32 cpu_load = 22;    // load * 100
  uint64 free_memory_mb = 23;

  google.protobuf.Timestamp boot_time = 30;
  google.protobuf.Timestamp last_busy = 31;
  google.protobuf.Timestamp slurmd_start_time = 32;

  string switch_name = 40;   // Leaf switch from topology config

  string active_reservation = 50;
  map<string, string> labels = 51;
  bool reservation_maint = 52;
  repeated string features = 53;

  // Set when the node is idle right now but the scheduler holds a future
  // reservation for a specific pending job (0 = no planned reservation).
  uint32 planned_job_id = 54;
  google.protobuf.Timestamp planned_start = 55;

  // Who set state_reason (Slurm reason_uid) and when (reason_time). `reason_uid`
  // is absent when no reason is set or the setter was unauthenticated; uid 0
  // marks a system/automatic reason.
  optional uint32 reason_uid = 56;
  google.protobuf.Timestamp reason_time = 57;
}

message PartitionInfo {
  string name = 1;
  string state = 2;          // UP, DOWN, DRAIN, INACTIVE
  bool is_default = 3;

  uint32 total_nodes = 10;
  uint32 total_cpus = 11;
  string nodes = 12;         // hostlist

  google.protobuf.Duration max_time = 20;
  google.protobuf.Duration default_time = 21;
  uint32 max_nodes = 22;
  uint32 min_nodes = 23;

  bool allow_root = 30;
  bool exclusive_user = 31;
  string allow_accounts = 32;
  string allow_groups = 33;
  string allow_qos = 34;
  string deny_accounts = 42;
  string deny_qos = 43;

  string preempt_mode = 40;
  uint32 priority_tier = 41;
  optional uint32 preempt_exempt_time = 44;   // absent = unset (inherits global default); 0 = no exemption
}

// ============================================================
// Services
// ============================================================

// -- Controller service (slurmctld) --

service SlurmController {
  // Job management
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJobs(GetJobsRequest) returns (GetJobsResponse);
  rpc GetJob(GetJobRequest) returns (JobInfo);
  rpc CancelJob(CancelJobRequest) returns (google.protobuf.Empty);
  // Finish a standalone srun allocation after its step completes.
  rpc CompleteJob(CompleteJobRequest) returns (google.protobuf.Empty);
  // Keepalive from an interactive client so an abandoned allocation can be reaped.
  rpc JobKeepalive(JobKeepaliveRequest) returns (JobKeepaliveResponse);
  rpc SuspendJob(SuspendJobRequest) returns (google.protobuf.Empty);
  rpc ResumeJob(ResumeJobRequest) returns (google.protobuf.Empty);
  rpc UpdateJob(UpdateJobRequest) returns (google.protobuf.Empty);
  // Requeue a running/suspended or finished batch job back to PENDING,
  // keeping the same job_id and spec. `hold` parks it in a held state.
  rpc RequeueJob(RequeueJobRequest) returns (RequeueJobResponse);

  // Node management
  rpc GetNodes(GetNodesRequest) returns (GetNodesResponse);
  rpc GetNode(GetNodeRequest) returns (NodeInfo);
  rpc UpdateNode(UpdateNodeRequest) returns (google.protobuf.Empty);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  rpc DeregisterNode(DeregisterNodeRequest) returns (DeregisterNodeResponse);

  // Agent deregistration (called by spurd on SIGTERM)
  rpc DeregisterAgent(DeregisterAgentRequest) returns (google.protobuf.Empty);

  // Partition management
  rpc GetPartitions(GetPartitionsRequest) returns (GetPartitionsResponse);

  // Job steps
  rpc GetJobSteps(GetJobStepsRequest) returns (GetJobStepsResponse);
  rpc CreateJobStep(CreateJobStepRequest) returns (CreateJobStepResponse);
  // RunStep records its own steps; a PTY step streams client-to-agent, so its
  // client reports the exit code here instead.
  rpc CompleteJobStep(CompleteJobStepRequest) returns (google.protobuf.Empty);

  // Health
  rpc Ping(google.protobuf.Empty) returns (PingResponse);

  // Cluster metrics snapshots
  rpc GetJobMetrics(google.protobuf.Empty) returns (JobMetrics);
  rpc GetNodeMetrics(google.protobuf.Empty) returns (NodeMetrics);

  // Controller RPC handler statistics (since process start or last reset)
  rpc GetRpcStats(google.protobuf.Empty) returns (RpcStats);
  rpc ResetDiagStats(google.protobuf.Empty) returns (google.protobuf.Empty);

  // Scheduler cycle and lifecycle statistics (since process start or last reset)
  rpc GetSchedStats(google.protobuf.Empty) returns (SchedStats);

  // Live limits-versus-usage snapshot for operators (`scontrol show assoc_mgr`):
  // what each user holds under a QOS or association next to the caps governing
  // it. Read-only, derived from the controller's job table.
  rpc GetAssocMgrInfo(GetAssocMgrInfoRequest) returns (GetAssocMgrInfoResponse);

  // Agent registration
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Admission token management
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // K8s operator callback: report job completion from Pod watcher
  rpc ReportJobStatus(ReportJobStatusRequest) returns (google.protobuf.Empty);

  // Partition management
  rpc CreatePartition(CreatePartitionRequest) returns (google.protobuf.Empty);
  rpc UpdatePartition(UpdatePartitionRequest) returns (google.protobuf.Empty);
  rpc DeletePartition(DeletePartitionRequest) returns (google.protobuf.Empty);
  rpc Reconfigure(google.protobuf.Empty) returns (google.protobuf.Empty);

  // Reservation management
  rpc CreateReservation(CreateReservationRequest) returns (google.protobuf.Empty);
  rpc UpdateReservation(UpdateReservationRequest) returns (google.protobuf.Empty);
  rpc DeleteReservation(DeleteReservationRequest) returns (google.protobuf.Empty);
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);

  // Exec a command inside a running job's container (proxies to correct agent)
  rpc ExecInJob(ExecInJobRequest) returns (ExecInJobResponse);

  // Run a step across an allocation's nodes — used by srun inside sbatch/salloc
  // and standalone srun. Fans out tasks via agent RunCommand RPCs.
  rpc RunStep(RunStepRequest) returns (RunStepResponse);

  // -- Native cluster (k0s) lifecycle: SPUR owns the k0s cluster --
  rpc ClusterUp(ClusterUpRequest) returns (ClusterUpResponse);
  rpc ClusterDown(ClusterDownRequest) returns (ClusterDownResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  rpc ClusterKubeconfig(ClusterKubeconfigRequest) returns (ClusterKubeconfigResponse);
  // Grow a running cluster's worker set online (scoped clusters only; no down/reset needed).
  rpc ClusterAddNodes(ClusterAddNodesRequest) returns (ClusterAddNodesResponse);
  // Gracefully remove workers from a running cluster (cordon+drain, then k0s reset the node).
  rpc ClusterRemoveNodes(ClusterRemoveNodesRequest) returns (ClusterRemoveNodesResponse);
}

// -- Agent service (slurmd) --

service SlurmAgent {
  rpc LaunchJob(LaunchJobRequest) returns (LaunchJobResponse);
  // Start PMIx server and verify multi-node peers before rank exec (multi-node pmix only).
  rpc PreparePmix(PreparePmixRequest) returns (PreparePmixResponse);
  // Tear down a prepared-but-not-launched PMIx server (prepare rollback).
  rpc ReleasePmix(ReleasePmixRequest) returns (ReleasePmixResponse);
  rpc CancelJob(AgentCancelJobRequest) returns (google.protobuf.Empty);
  rpc SuspendJob(AgentSuspendJobRequest) returns (google.protobuf.Empty);
  rpc GetNodeResources(google.protobuf.Empty) returns (NodeResourcesResponse);
  rpc ExecInJob(ExecInJobRequest) returns (ExecInJobResponse);
  // Run a one-shot command on this node (for srun step dispatch).
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
  // Stop an in-flight srun step on this node without cancelling the allocation job.
  rpc CancelStep(CancelStepRequest) returns (google.protobuf.Empty);
  // Record an allocation on this node without launching a batch process.
  rpc RegisterJobAllocation(RegisterJobAllocationRequest) returns (RegisterJobAllocationResponse);
  rpc StreamJobOutput(StreamJobOutputRequest) returns (stream StreamJobOutputChunk);
  // PTY-backed interactive session (srun --pty, sattach, srun --overlap --pty)
  rpc InteractiveSession(stream InteractiveInput) returns (stream InteractiveOutput);

  // -- Native cluster component control: the controller drives each node's
  //    spurd-owned k0s systemd unit through these. --
  rpc StartClusterComponent(StartClusterComponentRequest) returns (StartClusterComponentResponse);
  rpc StopClusterComponent(StopClusterComponentRequest) returns (StopClusterComponentResponse);
  rpc GetClusterComponentStatus(GetClusterComponentStatusRequest) returns (GetClusterComponentStatusResponse);

  // -- Control-plane-only cluster admin: the controller calls these on
  //    the control-plane node's agent, which shells `k0s` against the running
  //    controller. Worker joins need a fresh token; GetKubeconfig returns either
  //    the admin kubeconfig or a scoped per-user token. Erroring on a
  //    non-control-plane node is expected. --
  rpc CreateK0sJoinToken(CreateK0sJoinTokenRequest) returns (CreateK0sJoinTokenResponse);
  // Cordon + drain a k8s node by name (shells `k0s kubectl`). Control-plane-only.
  rpc DrainK8sNode(DrainK8sNodeRequest) returns (DrainK8sNodeResponse);
  // Delete a (drained, stopped) k8s Node object by name (shells `k0s kubectl delete node`).
  // Control-plane-only. Called after the component is stopped so the kubelet can't re-register.
  rpc DeleteK8sNode(DeleteK8sNodeRequest) returns (DeleteK8sNodeResponse);
  rpc GetKubeconfig(GetKubeconfigRequest) returns (GetKubeconfigResponse);

  // Apply the full-mesh WireGuard membership on this node: the controller pushes the
  // authoritative peer set so a native-routing CNI (Calico bird) can ride the mesh. Additive +
  // idempotent — safe to re-push.
  rpc ApplyMesh(MeshMembership) returns (ApplyMeshResponse);
}

// -- Accounting service --

service SlurmAccounting {
  rpc RecordJobStart(RecordJobStartRequest) returns (google.protobuf.Empty);
  rpc RecordJobEnd(RecordJobEndRequest) returns (google.protobuf.Empty);
  rpc GetJobHistory(GetJobHistoryRequest) returns (GetJobHistoryResponse);
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);

  // Account management (sacctmgr)
  rpc CreateAccount(CreateAccountRequest) returns (google.protobuf.Empty);
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // User management (sacctmgr)
  rpc AddUser(AddUserRequest) returns (google.protobuf.Empty);
  rpc RemoveUser(RemoveUserRequest) returns (google.protobuf.Empty);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // QOS management (sacctmgr)
  rpc CreateQos(CreateQosRequest) returns (google.protobuf.Empty);
  rpc DeleteQos(DeleteQosRequest) returns (google.protobuf.Empty);
  rpc ListQos(ListQosRequest) returns (ListQosResponse);

  // Fairshare
  rpc GetFairshareFactors(GetFairshareFactorsRequest) returns (GetFairshareFactorsResponse);

  // Transaction / audit log (reservation admin actions today; entity-agnostic)
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
}

// ============================================================
// Request/Response Messages
// ============================================================

// -- Controller --

message SubmitJobRequest {
  JobSpec spec = 1;
}

message SubmitJobResponse {
  uint32 job_id = 1;
  repeated string warnings = 2;
}

message GetJobsRequest {
  repeated JobState states = 1;
  string user = 2;
  string partition = 3;
  string account = 4;
  repeated uint32 job_ids = 5;
  string name = 6;
  // Filter: only jobs allocated on any of these nodes (expanded hostlist).
  repeated string nodes = 7;
}

message GetJobsResponse {
  repeated JobInfo jobs = 1;
}

message GetJobRequest {
  uint32 job_id = 1;
}

message CancelJobRequest {
  uint32 job_id = 1;
  int32 signal = 2;  // 0 = cancel, else signal number
  string user = 3;   // For authorization
}

message CompleteJobRequest {
  uint32 job_id = 1;
  int32 exit_code = 2;
  string user = 3;   // For authorization
}

// Liveness ping from an interactive client (salloc/srun) so the controller
// knows the allocation is still attended. Absence past InactiveLimit reaps it.
message JobKeepaliveRequest {
  uint32 job_id = 1;
  string user = 2;   // For authorization (owner or root required).
}

message JobKeepaliveResponse {}

message SuspendJobRequest {
  uint32 job_id = 1;
  string user = 2;   // For authorization (owner or root required).
}

message ResumeJobRequest {
  uint32 job_id = 1;
  string user = 2;   // For authorization (owner or root required).
}

message UpdateJobRequest {
  uint32 job_id = 1;
  optional string partition = 2;
  optional string account = 3;
  optional uint32 priority = 4;
  optional google.protobuf.Duration time_limit = 5;
  optional bool hold = 6;
  optional string comment = 7;
  optional string qos = 8;
  string user = 9;   // Requesting user; verified identity must own the job; the controller/admin credential overrides
}

message RequeueJobRequest {
  uint32 job_id = 1;   // Array parent id fans out to every task.
  string user = 2;     // For authorization (owner or root).
  bool hold = 3;       // Requeue into a held state (requeuehold).
}

message RequeueJobResponse {
  uint32 requeued = 1;         // Jobs/array tasks returned to the queue.
  repeated string skipped = 2; // "job N: reason" for tasks that could not be requeued (array fan-out).
}

message GetNodesRequest {
  repeated NodeState states = 1;
  string partition = 2;
  string nodelist = 3;  // hostlist pattern
}

message GetNodesResponse {
  repeated NodeInfo nodes = 1;
}

message GetNodeRequest {
  string name = 1;
}

message UpdateNodeRequest {
  string name = 1;
  optional NodeState state = 2;
  optional string reason = 3;
  map<string, string> labels = 4;
  repeated string remove_labels = 5;
}

message DrainNodeRequest {
  string name = 1;
  string reason = 2;
}

message DrainNodeResponse {
  string actual_state = 1;
  uint32 running_jobs = 2;
}

message DeregisterNodeRequest {
  string name = 1;
  bool force = 2;
  string reason = 3;
}

message DeregisterNodeResponse {
  uint32 evicted_jobs_count = 1;
}

message DeregisterAgentRequest {
  string hostname = 1;
  string node_token = 2;
  string reason = 3;
}

message GetPartitionsRequest {
  string name = 1;  // empty = all
}

message GetPartitionsResponse {
  repeated PartitionInfo partitions = 1;
}

message PingResponse {
  string hostname = 1;
  google.protobuf.Timestamp server_time = 2;
  string version = 3;
  repeated string federation_peers = 4;
  string cluster_name = 5;
}

message JobStateCount {
  JobState state = 1;
  uint64 count = 2;
}

message JobMetrics {
  uint64 total = 1;
  repeated JobStateCount by_state = 2;
  uint64 held_pending = 3;
  uint64 running_cpus = 4;
  uint64 running_memory_bytes = 5;
  uint64 running_gpus = 6;
}

message NodeStateCount {
  NodeState state = 1;
  uint64 count = 2;
}

message NodeMetricsEntry {
  string name = 1;
  uint64 total_cpus = 2;
  uint64 alloc_cpus = 3;
  uint64 total_memory_bytes = 4;
  uint64 alloc_memory_bytes = 5;
  uint64 total_gpus = 6;
  uint64 alloc_gpus = 7;
  uint64 cpu_load = 8;
  uint64 free_memory_bytes = 9;
}

message NodeMetrics {
  uint64 total = 1;
  repeated NodeStateCount by_state = 2;
  uint64 total_cpus = 3;
  uint64 alloc_cpus = 4;
  uint64 total_memory_bytes = 5;
  uint64 alloc_memory_bytes = 6;
  uint64 total_gpus = 7;
  uint64 alloc_gpus = 8;
  repeated NodeMetricsEntry per_node = 9;
}

message RpcOperationStats {
  string operation = 1;
  uint64 count = 2;
  uint64 total_time_us = 3;
  uint64 avg_time_us = 4;
}

message RpcStats {
  repeated RpcOperationStats by_operation = 1;
}

message SchedStats {
  string plugin = 1;
  uint64 cycles = 2;
  uint64 cycle_total_time_us = 3;
  uint64 cycle_last_time_us = 4;
  uint64 cycle_avg_time_us = 5;
  uint64 schedule_total_time_us = 6;
  uint64 schedule_last_time_us = 7;
  uint64 schedule_avg_time_us = 8;
  uint64 jobs_submitted = 9;
  uint64 jobs_started = 10;
  uint64 jobs_finalized = 11;
  uint64 jobs_started_last_cycle = 12;
  uint64 exit_end = 13;
  uint64 exit_max_depth = 14;
  uint64 jobs_preempted = 15;
}

// What one user holds under a scope, beside the caps governing that user. Counts
// and TRES are live figures from the controller's job table, computed the way the
// admission gate computes them, so they read as the scheduler sees them. Caps and
// consumption stay separate fields rather than arriving pre-rendered as Slurm's
// `Limit(Consumed)`, so a machine consumer does not have to unpick a display
// string; the CLI composes that shape. Caps carry the INFINITE sentinel when
// unset, TRES are `<name>=<value>` strings (e.g. `cpu=36,node=9`), empty when
// nothing is held or capped.
message AssocMgrUserRecord {
  string user = 1;
  uint32 running_jobs = 2;
  uint32 submitted_jobs = 3;   // pending + running
  string running_tres = 4;
  uint32 max_jobs = 5;
  uint32 max_submit_jobs = 6;
  string max_tres = 7;
  // Per-user caps this user is already over, named as `sacctmgr` names them (e.g.
  // "MaxJobsPU"). Decided controller-side so every consumer reads the same
  // verdict. Empty when everything is within its cap.
  repeated string over_limit = 8;
}

// Caps a scope applies to each of its users, where the scope defines them once —
// a QOS does. An association's caps are per (user, account) and ride on each user
// record instead, so this is absent there. Present even for a scope with no queued
// work, which is where a misconfigured cap on an idle QOS would otherwise be
// invisible.
message AssocMgrCaps {
  uint32 max_jobs = 1;
  uint32 max_submit_jobs = 2;
  string max_tres = 3;
}

// A QOS or an association with the caps and consumption belonging to the scope
// itself, plus the users holding work under it. Nesting per-user limits inside
// the record they qualify follows Slurm's `assoc_mgr`, and keeps a scope's group
// figures from being repeated once per user. A scope with no queued work carries
// no user records, and is still reported so a misconfigured cap on an idle QOS
// remains visible.
message AssocMgrRecord {
  string scope = 1;
  uint32 grp_running_jobs = 2;
  uint32 grp_submitted_jobs = 3;
  string grp_running_tres = 4;
  string grp_tres = 5;
  uint32 grp_submit_jobs = 6;
  uint32 max_wall_minutes = 7;
  repeated AssocMgrUserRecord users = 8;
  // Scope-wide caps already exceeded, named as `sacctmgr` names them.
  repeated string over_limit = 9;
  AssocMgrCaps scope_caps = 10;
}

message GetAssocMgrInfoRequest {
  // Restrict to one user; empty covers every user. Scopes are still reported when
  // the filtered user holds nothing in them, since a scope's own caps and group
  // consumption do not belong to any one user.
  string user = 1;
}

message GetAssocMgrInfoResponse {
  repeated AssocMgrRecord qos_records = 1;
  repeated AssocMgrRecord assoc_records = 2;
  // False only when accounting is enabled yet a cache still holds no snapshot:
  // the usage figures stand, but some caps below may be missing. Accounting-off
  // clusters report true, since a cluster with no caps is not one whose caps
  // could not be read.
  bool limits_readable = 3;
}

message RegisterAgentRequest {
  string hostname = 1;
  ResourceSet resources = 2;
  string version = 3;
  string address = 4;        // Agent's preferred IP (e.g. WireGuard 10.44.x.y)
  uint32 port = 5;           // Agent gRPC listen port
  string wg_pubkey = 6;      // WireGuard public key (for mesh setup)
  map<string, string> labels = 7;  // Node labels for partition routing (pool, rack, etc.)
  string join_token = 8;     // Admission token for token-based admission
}

message RegisterAgentResponse {
  bool accepted = 1;
  string message = 2;
  string node_token = 3;
}

message HeartbeatRequest {
  string hostname = 1;
  uint32 cpu_load = 2;
  uint64 free_memory_mb = 3;
  repeated RunningJobStatus running_jobs = 4;
  string node_token = 5;
  // This node's current WireGuard mesh public key. Re-sent every heartbeat so the controller
  // learns a key that appears/changes after registration (late mesh, spur0 recreated) and can
  // include the node in ApplyMesh without a spurd restart. Empty when the node has no mesh key.
  string wg_pubkey = 6;
  // k0s supervision status; present only when the node runs a k0s unit ([cluster].enabled).
  optional K0sNodeStatus k0s_status = 7;
}

// Per-node k0s supervision status, reported on the heartbeat for spur_k8s_node_* metrics.
message K0sNodeStatus {
  bool unit_active = 1;               // node's k0s systemd unit currently reports active
  // systemd NRestarts for the k0s unit: persists across spurd restarts, resets when the unit is recreated.
  uint64 restart_count = 2;
  double install_duration_seconds = 3; // install-to-active seconds, reported once after an install
}

message RunningJobStatus {
  uint32 job_id = 1;
  JobState state = 2;
  int32 exit_code = 3;
}

message HeartbeatResponse {}

message PmixLocalProc {
  uint32 rank = 1;
  uint32 local_rank = 2;
}

message PmixLaunchPlan {
  uint32 job_id = 1;
  string namespace = 2;
  uint32 universe_size = 3;
  uint32 task_offset = 4;
  repeated PmixLocalProc local_procs = 5;
  string tmpdir = 6;
  uint32 job_uid = 7;
  uint32 job_gid = 8;
  uint32 num_nodes = 9;
  uint32 node_index = 10;
  repeated string peer_hosts = 11;
  // 0 = agent falls back to [mpi] config defaults.
  uint32 modex_connect_timeout_secs = 12;
  uint32 modex_fence_timeout_secs = 13;
  uint32 modex_verify_timeout_secs = 14;
}

// -- Agent --

message LaunchJobRequest {
  uint32 job_id = 1;
  JobSpec spec = 2;
  ResourceAllocations allocated = 3;
  repeated string peer_nodes = 4;  // All nodes in this job's allocation
  uint32 task_offset = 5;          // This node's starting task index
  string target_node = 6;          // Which K8s/Spur node this dispatch targets
  // Per-task array identity, controller-assigned at expansion (not user-supplied).
  // array_job_id is the parent id (0 = not an array task); exported as SLURM_ARRAY_*.
  uint32 array_job_id = 7;
  uint32 array_task_id = 8;
  // Run epoch for this dispatch; agent echoes it in ReportJobStatusRequest so
  // the controller can drop stale-run reports. 0 = unset (legacy), check off.
  uint32 run_attempt = 9;
  PmixLaunchPlan pmix_plan = 10;
  // True when this dispatch is itself a per-task fan-out mechanism (a
  // standalone `srun` request routed through the batch dispatch path, e.g.
  // an allocation spanning Kubernetes-backed nodes) and `spec.script` is the
  // literal command that should run `tasks_per_node` times on this node.
  // False (default) for a genuine `sbatch` batch script: it runs exactly
  // once per node regardless of tasks_per_node or mpi, matching Slurm
  // semantics — task multiplicity (including multi-rank MPI) is only
  // advertised via environment variables, and any fan-out is the script's
  // own responsibility, typically via an internal `srun` call.
  bool task_fanout = 11;
  // When true, PMIx was prepared via PreparePmix; LaunchJob must not re-init the server.
  bool pmix_prepared = 12;
}

// Why a launch was rejected, when the controller's response depends on it.
// Only kinds with a live emission path are listed; an agent that predates a
// kind sends UNSPECIFIED and the controller falls back to its generic handling.
enum LaunchFailureKind {
  LAUNCH_FAILURE_UNSPECIFIED = 0;
  // The node ran the job's prolog and it failed. The controller drains the node
  // and holds the job rather than retrying, since a prolog sees the job's own
  // context and so fails the same way everywhere.
  LAUNCH_FAILURE_PROLOG = 1;
}

message PreparePmixRequest {
  uint32 job_id = 1;
  PmixLaunchPlan pmix_plan = 2;
  uint32 run_attempt = 3;
}

message PreparePmixResponse {
  bool success = 1;
  string error = 2;
}

message ReleasePmixRequest {
  uint32 job_id = 1;
}

message ReleasePmixResponse {}

message LaunchJobResponse {
  bool success = 1;
  string error = 2;
  string stdout_path = 3;  // absolute resolved output path on the launching node
  string stderr_path = 4;
  LaunchFailureKind failure_kind = 5;
}

message AgentCancelJobRequest {
  uint32 job_id = 1;
  int32 signal = 2;
}

message AgentSuspendJobRequest {
  uint32 job_id = 1;
  bool resume = 2;   // false = SIGSTOP (suspend), true = SIGCONT (resume)
}

message NodeResourcesResponse {
  ResourceSet total = 1;
  ResourceAllocations used = 2;
}

message ExecInJobRequest {
  uint32 job_id = 1;
  repeated string command = 2;  // Command to exec inside the container
  string user = 3;              // Requesting user; verified identity must own the job; the controller/admin credential overrides
}

message ExecInJobResponse {
  bool success = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
}

// Controller-side request: run a step inside an allocation. The controller
// fans out tasks across the allocation's nodes via each agent's RunCommand
// RPC. Used by srun inside sbatch/salloc and standalone srun.
message RunStepRequest {
  uint32 job_id = 1;
  repeated string command = 2;
  uint32 uid = 3;
  uint32 gid = 4;
  string work_dir = 5;
  map<string, string> environment = 6;
  uint32 step_id = 7;  // Step id from CreateJobStep, for recording completion
  bool label = 8;      // Prefix output lines with [rank] (srun -l)
  string mpi = 9;      // Step MPI type; when empty, inherit job.spec.mpi
  string user = 10;    // Requesting user; verified identity must own the job; the controller/admin credential overrides
  // Step-level container override. Absent = inherit from the parent job's
  // container config (empty image = run on the host / enter the parent).
  ContainerSpec container = 11;
}

// Container settings carried on a step RPC, mirroring the JobSpec container
// fields. An empty `image` means no container.
message ContainerSpec {
  string image = 1;                 // OCI image ref or squashfs path
  repeated string mounts = 2;       // "/src:/dst:ro" bind mounts
  string workdir = 3;               // Working directory inside the container
  string name = 4;                  // Named container (persists across jobs)
  bool readonly = 5;                // Read-only rootfs
  bool mount_home = 6;              // Bind-mount the user's home directory
  map<string, string> env = 7;      // Extra env vars inside the container
  string entrypoint = 8;            // Override the container entrypoint
  bool remap_root = 9;              // Remap the user to root inside the container
}

message RunStepResponse {
  int32 exit_code = 1;   // Max exit code across all tasks in the step
  string stdout = 2;     // Aggregated stdout from all tasks/nodes
  string stderr = 3;     // Aggregated stderr from all tasks/nodes
  string node = 4;       // Comma-separated hostnames that ran tasks
}

// -- Native cluster (k0s) lifecycle messages --

message ClusterUpRequest {
  // Override the control-plane node; empty = pick from [cluster] config / inventory.
  optional string control_plane_node = 1;
  reserved 2; // was install_arc — ARC is not installed by spur/k0s
  // HA control-plane count (1, 3, or 5). 0/absent = the [cluster] config default. Ignored if
  // control_plane_nodes is set.
  optional uint32 control_plane_replicas = 3;
  // Explicit control-plane node names (1, 3, or 5). First is the etcd bootstrap node.
  repeated string control_plane_nodes = 4;
  string caller = 5;   // For authorization (cluster admin required).
  // Scope the cluster to a subset of the inventory: UNION of a nodes hostlist (e.g. "gpu[01-08]"),
  // a partition's members, and a label selector (all key=val match). Empty = whole inventory.
  // Resolved once at up time and persisted; not re-evaluated as inventory changes.
  string nodes = 6;
  string partition = 7;
  map<string, string> selector = 8;
}
message ClusterUpResponse {
  bool accepted = 1;
  string message = 2;
  repeated ClusterNodeStatus nodes = 3;
}

message ClusterDownRequest {
  // Also `k0s reset` each node (destructive: wipes cluster state).
  bool reset = 1;
  string caller = 2;   // For authorization (cluster admin required).
}
message ClusterDownResponse {
  bool accepted = 1;
  string message = 2;
}

message ClusterStatusRequest {}
message ClusterStatusResponse {
  // "down" | "provisioning" | "ready" | "degraded"
  string phase = 1;
  string control_plane_node = 2;
  repeated ClusterNodeStatus nodes = 3;
  // All control-plane nodes (HA). Bootstrap node first; empty pre-multi-CP (see control_plane_node).
  repeated string control_plane_nodes = 4;
  // Member nodes the cluster is scoped to. Empty = the whole inventory is enrolled.
  repeated string member_nodes = 5;
}

message ClusterNodeStatus {
  string node = 1;
  string role = 2;             // "controller" | "worker" | "single"
  string component_state = 3;  // systemd active-state: "active" | "inactive" | "failed" | "unknown"
  bool enabled = 4;
  string reason = 5;           // why this node blocked convergence when degraded; empty otherwise
}

message ClusterAddNodesRequest {
  // Nodes to add to a scoped cluster's worker set: UNION of a hostlist (e.g. "gpu[09-12]"), a
  // partition's members, and a label selector (all key=val match). Same resolution as ClusterUp's
  // scope fields. At least one selector must be non-empty.
  string nodes = 1;
  string partition = 2;
  map<string, string> selector = 3;
  string caller = 4;   // For authorization (cluster admin required).
}
message ClusterAddNodesResponse {
  bool accepted = 1;
  string message = 2;
  // Current per-node status. A just-added node only appears once the reconcile loop has assigned it
  // a role (it has none at accept time), so it may be absent from the immediate response.
  repeated ClusterNodeStatus nodes = 3;
}

message ClusterRemoveNodesRequest {
  // Worker nodes to remove (hostlist, e.g. "gpu[09-12]").
  string nodes = 1;
  string caller = 2;   // For authorization (cluster admin required).
  // Max seconds to wait for the k8s drain per node. 0/absent = server default.
  optional uint32 drain_timeout_secs = 3;
  // Proceed even if a node has running SPUR jobs (they are left running — this only skips the
  // busy-node check, it does not evict them) or its drain does not complete (bypasses
  // PodDisruptionBudgets via kubectl --force --disable-eviction). Destructive.
  optional bool force = 4;
}
message ClusterRemoveNodesResponse {
  bool accepted = 1;
  string message = 2;
  repeated ClusterNodeStatus nodes = 3;  // resulting per-node status after the removal
}

message ClusterKubeconfigRequest {
  // Target user for the scoped kubeconfig. Empty -> the caller's own namespace. A non-empty value
  // other than the caller requires cluster admin.
  string user = 1;
  string caller = 2;   // For authorization; empty is treated as root (internal).
  bool admin = 3;      // Request the cluster-admin kubeconfig (cluster admin required).
}
message ClusterKubeconfigResponse {
  // Admin kubeconfig YAML (server rewritten to the control-plane's mesh IP), or the scoped kubeconfig
  // when `user` was set.
  string kubeconfig = 1;
}

// -- Agent-side cluster component control messages --

message StartClusterComponentRequest {
  string role = 1;             // "controller" | "worker" | "single"
  // k0s join token (bearer secret — never log). Empty for single / first controller.
  optional string join_token = 2;
  // Rendered k0s config YAML. Empty = agent uses role defaults.
  optional string k0s_config = 3;
  // Worker kubelet --node-ip (its mesh IP) for native-routing CNIs. Empty = k0s picks the default.
  optional string node_ip = 4;
}
message StartClusterComponentResponse {
  bool started = 1;
  string component_state = 2;  // systemd active-state after the action
  string message = 3;
}

message StopClusterComponentRequest {
  bool reset = 1;              // also `k0s reset` (destructive)
}
message StopClusterComponentResponse {
  bool stopped = 1;
  string message = 2;
}

message GetClusterComponentStatusRequest {}
message GetClusterComponentStatusResponse {
  string role = 1;
  string component_state = 2;  // "active" | "inactive" | "failed" | "unknown"
  bool enabled = 3;
}

// -- Control-plane-only cluster admin messages --

message CreateK0sJoinTokenRequest {
  string role = 1;             // "worker" | "controller"
  uint64 expiry_seconds = 2;   // token lifetime; 0 = k0s default
}
message CreateK0sJoinTokenResponse {
  // k0s join token (bearer secret — never log).
  string join_token = 1;
}

message DrainK8sNodeRequest {
  string node = 1;                  // k8s node name to cordon + drain
  uint32 timeout_secs = 2;          // drain timeout; 0 = agent default
  bool force = 3;                   // when set, pass kubectl drain --force --disable-eviction (bypass PDBs)
}
message DrainK8sNodeResponse {
  bool drained = 1;                 // true if cordon+drain completed
  string message = 2;               // detail when not drained (e.g. PDB blocked, timeout)
}

message DeleteK8sNodeRequest {
  string node = 1;                  // k8s node name to delete (after its component is stopped)
}
message DeleteK8sNodeResponse {
  bool deleted = 1;                 // true if the Node object was deleted (or already absent)
  string message = 2;               // detail on failure
}

message GetKubeconfigRequest {
  // Empty `user` -> the cluster-admin kubeconfig (namespace/service_account ignored). When `user` is
  // set, the control-plane node mints a scoped kubeconfig: a bound token for `service_account` in
  // `namespace` (created if absent), with the admin cluster CA + server. spurctld resolves the SPUR
  // user -> account namespace + SA name.
  string user = 1;
  string namespace = 2;
  string service_account = 3;
}
message GetKubeconfigResponse {
  // Admin (or scoped) kubeconfig YAML read/minted on the control-plane node.
  string kubeconfig = 1;
}

// -- Full-mesh membership: proto mirror of spur_net::mesh::MeshNode/MeshMembership --

message MeshNode {
  string hostname = 1;     // node name (used to resolve self + the agent endpoint)
  string public_key = 2;   // WireGuard public key
  string mesh_ip = 3;      // mesh address on spur0 (no prefix), e.g. 10.44.0.2
  string endpoint = 4;     // underlay endpoint, e.g. 198.51.100.2:51820
  optional string pod_cidr = 5; // node's pod /24 for native-routing CNIs
}
message MeshMembership {
  repeated MeshNode nodes = 1;
}
message ApplyMeshResponse {
  bool applied = 1;
  uint32 peers = 2;        // number of peers applied (self excluded)
  string message = 3;
}

// Agent-side request: run a command directly on this node (no namespace
// entry, since salloc allocations don't track a job process). The agent
// runs the command as the requested uid/gid in the requested work_dir.
message RunCommandRequest {
  repeated string command = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  string work_dir = 4;
  map<string, string> environment = 5;
  uint32 job_id = 6;
  uint32 num_tasks = 7;        // Tasks to launch on this node (default 1)
  uint32 task_offset = 8;      // Global rank of the first local task
  uint32 step_id = 9;
  uint32 step_num_tasks = 10;  // Total tasks in the step (SLURM_NTASKS)
  bool label = 11;             // Prefix output with [rank] inside wrapper
  PmixLaunchPlan pmix_plan = 12;
  string mpi = 13;             // Resolved step MPI type: "none" or "pmix"
  // When true, PMIx was prepared via PreparePmix on the controller before RunCommand.
  bool pmix_prepared = 14;
  // Container for this step. Absent/empty image = no container; the step runs
  // on the host or enters the parent job's namespaces when it is containerized.
  ContainerSpec container = 15;
  // Step node subset (comma-separated names). Empty = use the job allocation
  // nodelist. Drives SPUR_NODELIST / SPUR_NNODES / SPUR_NODEID for the step.
  string nodelist = 16;
}

// Register a srun-only allocation on an agent without starting a batch process.
message RegisterJobAllocationRequest {
  uint32 job_id = 1;
  string partition = 2;
  string nodelist = 3;
  uint32 uid = 4;
  uint32 gid = 5;
  uint32 cpus = 6;
  uint64 memory_mb = 7;
  repeated string gpu_devices = 8;
  ResourceAllocations allocated = 9;
  string mpi = 10;
  string work_dir = 11;
  string user = 12;  // Job owner; the agent gates exec/attach on it
}

message RegisterJobAllocationResponse {}

message RunCommandResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}

message CancelStepRequest {
  uint32 job_id = 1;
  uint32 step_id = 2;
  int32 signal = 3;  // 0 = SIGTERM, 9 = SIGKILL, etc.
}

message StreamJobOutputRequest {
  uint32 job_id = 1;
  string stream = 2;  // "stdout" or "stderr"
  string user = 3;    // Requesting user; verified identity must own the job; the controller/admin credential overrides
  uint32 step_id = 4; // 0 = the batch job's own output; >0 = tail that step's per-step spool file
}

message StreamJobOutputChunk {
  bytes data = 1;
  bool eof = 2;
}

// -- Interactive PTY session (srun --pty, sattach, srun --overlap --pty) --

message WindowSize {
  uint32 rows = 1;
  uint32 cols = 2;
  uint32 xpixel = 3;
  uint32 ypixel = 4;
}

message InitSession {
  uint32 job_id = 1;
  uint32 step_id = 2;        // 0 = primary job session
  bool overlap = 3;          // Enter running job's namespaces (--overlap)
  bool pty = 4;              // Always true for now
  WindowSize winsize = 5;    // Initial terminal dimensions
  repeated string argv = 6;  // Command to run (empty = default shell)
  map<string, string> env = 7;
  string user = 8;           // Requesting user; verified identity must own the job; the controller/admin credential overrides
  ContainerSpec container = 9;  // Effective container the step runs in (empty image = host); resolved by the controller
  bool non_interactive = 10;    // Client stdin is not a TTY: input-stream close is stdin-EOF (drain output), not a hangup (SIGHUP)
}

message InteractiveInput {
  oneof msg {
    InitSession init = 1;    // First message: session setup
    bytes stdin = 2;         // Raw stdin bytes
    WindowSize resize = 3;   // Terminal resize (SIGWINCH)
    int32 signal = 4;        // Out-of-band signal to foreground pgrp
  }
}

message InteractiveOutput {
  oneof msg {
    bytes data = 1;          // PTY master output (stdout+stderr merged)
    int32 exit_status = 2;   // Final exit code; terminates the stream
  }
}

// -- Accounting --

message RecordJobStartRequest {
  uint32 job_id = 1;
  string user = 2;
  string account = 3;
  string partition = 4;
  ResourceAllocations resources = 5;
  google.protobuf.Timestamp start_time = 6;
  string reservation = 7;
  string name = 8;
  google.protobuf.Timestamp submit_time = 9;
  string qos = 10;
}

message RecordJobEndRequest {
  uint32 job_id = 1;
  JobState final_state = 2;
  int32 exit_code = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 exit_signal = 5;        // Terminating signal of primary node (0 = none)
  int32 derived_exit_code = 6;  // Running max over srun step exit codes (0 if no steps)
}

message GetJobHistoryRequest {
  string user = 1;
  string account = 2;
  google.protobuf.Timestamp start_after = 3;
  google.protobuf.Timestamp start_before = 4;
  repeated JobState states = 5;
  uint32 limit = 6;
  repeated uint32 job_ids = 7;
}

message GetJobHistoryResponse {
  repeated JobInfo jobs = 1;
}

// Audit/transaction log query. All string filters are optional (empty = no
// filter); time bounds are optional (unset = no time constraint).
message GetTransactionsRequest {
  string actor = 1;
  string entity_type = 2;
  string entity_name = 3;
  string action = 4;
  string outcome = 5;
  google.protobuf.Timestamp start_after = 6;
  google.protobuf.Timestamp start_before = 7;
  uint32 limit = 8;
}

message TransactionRecord {
  int64 id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string actor = 3;
  uint32 actor_uid = 4;         // 0 when unknown (e.g. unauthenticated caller)
  bool verified = 5;            // true only when a JWT identity was verified
  string source = 6;            // "api" | "system"
  string action = 7;            // "create" | "update" | "delete"
  string entity_type = 8;       // "reservation"
  string entity_name = 9;
  string outcome = 10;          // "success" | "denied" | "error"
  string details = 11;          // JSON: requested parameters (+ error on failure)
}

message GetTransactionsResponse {
  repeated TransactionRecord transactions = 1;
}

message GetUsageRequest {
  string user = 1;
  string account = 2;
  google.protobuf.Timestamp since = 3;
}

message UsageEntry {
  string user = 1;
  string account = 2;
  double cpu_hours = 3;
  double gpu_hours = 4;
  uint64 job_count = 5;
}

message GetUsageResponse {
  repeated UsageEntry entries = 1;
}

message GetFairshareFactorsRequest {
  uint32 halflife_days = 1;
}

message FairshareEntry {
  string user = 1;
  string account = 2;
  double factor = 3;
}

message GetFairshareFactorsResponse {
  repeated FairshareEntry entries = 1;
}

// -- K8s Operator --

message ReportJobStatusRequest {
  uint32 job_id = 1;
  // Completion gate for per-node reports. Must be JOB_COMPLETED when
  // exit_code==0, or JOB_FAILED when exit_code!=0.
  //
  // spurctld aggregates all per-node exit codes via derived_completion and
  // computes the final job state from those codes. This field does not set the
  // final job state by itself. Other terminal states (CANCELLED, TIMEOUT,
  // NODE_FAIL) are invalid on this RPC.
  JobState state = 2;
  int32 exit_code = 3;
  string message = 4;  // Pod status message or error
  bool drain_node = 5;     // Agent requests its node be drained (e.g. prolog/epilog failure)
  string drain_reason = 6; // Reason for drain request
  string reporting_node = 7; // Hostname of the reporting agent (for drain targeting)
  int32 signal = 8;  // Terminating signal of the reporting node's process (0 = none)
  // Echoed from LaunchJobRequest.run_attempt; controller drops this report if
  // older than the job's current epoch. 0 = unset (legacy), check off.
  uint32 run_attempt = 9;
}

// ============================================================
// Account/User/QOS Management (sacctmgr)
// ============================================================

// Add or modify an account (proto3 presence: unset = leave unchanged on modify,
// set = write; `add` sets every field). Empty string clears the text fields
// parent_account and grp_tres to NULL. max_running_jobs follows the sentinel
// rule on its field (INFINITE clears, a literal 0 is stored). description,
// organization, and fairshare_weight store their literal value (0 is a real
// weight, not a clear).
message CreateAccountRequest {
  string name = 1;
  optional string description = 2;
  optional string organization = 3;
  optional string parent_account = 4;
  optional double fairshare_weight = 5;
  // Unset preserves the stored value; the INFINITE sentinel (4294967295) clears
  // to no-limit; any other value (including a literal 0) is stored as-is.
  optional uint32 max_running_jobs = 6;
  optional string grp_tres = 7;
}

message DeleteAccountRequest {
  string name = 1;
}

message ListAccountsRequest { }

message ListAccountsResponse {
  repeated AccountInfo accounts = 1;
}

message AccountInfo {
  string name = 1;
  string description = 2;
  string organization = 3;
  string parent_account = 4;
  double fairshare_weight = 5;
  uint32 max_running_jobs = 6;
  string grp_tres = 7;
}

// Add or modify a user-account association (proto3 presence: unset = leave
// unchanged on modify, set = write; `add` sets every field). For the numeric
// limit fields below: unset preserves the stored value, the INFINITE sentinel
// (4294967295) clears to no-limit (SQL NULL), and any other value (including a
// literal 0, which means "block all") is stored as-is. Text limit fields
// (max_tres_*, grp_tres) clear to NULL when set empty. admin_level is
// non-nullable, storing the literal sent (unset keeps it, 'none' on create).
message AddUserRequest {
  string user = 1;
  string account = 2;
  optional string admin_level = 3;
  optional bool is_default = 4;
  // Default QOS for this user's association with `account`. Unset preserves
  // the stored default; explicit empty clears it.
  optional string default_qos = 5;
  // Association-level resource limits for `user` within `account`. See the
  // message-level comment for the unset/INFINITE/literal sentinel semantics.
  optional uint32 max_running_jobs = 6;
  optional uint32 max_submit_jobs = 7;
  optional string max_tres_per_job = 8;
  optional string grp_tres = 9;
  optional uint32 max_wall_minutes = 10;
  // Comma-separated QOS names this association may use. Unset preserves the
  // stored allow-list; explicit empty clears it back to unrestricted.
  // default_qos must be a member when both are set in the same request.
  optional string allowed_qos = 11;
  // Max submitted (pending + running) jobs across all users in the account.
  optional uint32 grp_submit_jobs = 12;
}

message RemoveUserRequest {
  string user = 1;
  string account = 2;
}

message ListUsersRequest {
  string account = 1;
  string user = 2;
}

message ListUsersResponse {
  repeated UserInfo users = 1;
}

message UserInfo {
  string name = 1;
  string account = 2;
  string admin_level = 3;
  string default_account = 4;
  string default_qos = 5;
  string allowed_qos = 6;
  // Per-association limits (read-back of what `sacctmgr add/modify user` set).
  // Numeric fields use the INFINITE sentinel (4294967295) for "no limit"; a
  // literal 0 means "block all". Text fields are empty when unset.
  uint32 max_running_jobs = 7;
  uint32 max_submit_jobs = 8;
  uint32 grp_submit_jobs = 9;
  uint32 max_wall_minutes = 10;
  string max_tres_per_job = 11;
  string grp_tres = 12;
}

// Add or modify a QOS (proto3 presence: unset = leave unchanged on modify, set =
// write; `add` sets every field). For the numeric limit fields: unset preserves
// the stored value, the INFINITE sentinel (4294967295) clears to no-limit (SQL
// NULL), and any other value (including a literal 0, which means "block all") is
// stored as-is. Text limits (max_tres_*, grp_tres) clear to NULL when set empty.
// description, preempt_mode, priority, and usage_factor store their literal
// value (0 is real).
message CreateQosRequest {
  string name = 1;
  optional string description = 2;
  optional int32 priority = 3;
  optional string preempt_mode = 4;
  optional double usage_factor = 5;
  optional uint32 max_jobs_per_user = 6;
  optional uint32 max_wall_minutes = 7;
  optional string max_tres_per_job = 8;
  optional uint32 max_submit_jobs_per_user = 9;
  optional string max_tres_per_user = 10;
  optional string grp_tres = 11;
  optional uint32 grp_wall_minutes = 12;
  // Comma-separated list of QOS names this QOS is allowed to preempt.
  // Only enforced when scheduler.preempt_type = qos_priority.
  // Empty string clears the list. Absent = no change on update.
  optional string preempt = 13;
  // Minimum seconds a job must run before eligible for preemption.
  // 0 is a valid value meaning "immediately preemptable" (no exemption).
  // Absent = no change on update.
  optional uint32 preempt_exempt_time = 14;
  // Set to true to clear preempt_exempt_time back to NULL (inherit from
  // partition / global default). Takes precedence over preempt_exempt_time.
  bool clear_preempt_exempt_time = 15;
  // Max submitted (pending + running) jobs per account within this QOS.
  optional uint32 max_submit_jobs_per_account = 16;
  // Max submitted (pending + running) jobs across all users in this QOS.
  optional uint32 grp_submit_jobs = 17;
  // Comma-separated QOS flags. Recognized: DenyOnLimit. Unset preserves the
  // stored flags; explicit empty clears them.
  optional string flags = 18;
}

message DeleteQosRequest {
  string name = 1;
}

message ListQosRequest { }

message ListQosResponse {
  repeated QosInfo qos_list = 1;
}

message QosInfo {
  string name = 1;
  string description = 2;
  int32 priority = 3;
  string preempt_mode = 4;
  double usage_factor = 5;
  uint32 max_jobs_per_user = 6;
  uint32 max_wall_minutes = 7;
  string max_tres_per_job = 8;
  uint32 max_submit_jobs_per_user = 9;
  string max_tres_per_user = 10;
  string grp_tres = 11;
  uint32 grp_wall_minutes = 12;
  // Comma-separated QOS names this QOS may preempt (empty = none allowed).
  string preempt = 13;
  optional uint32 preempt_exempt_time = 14;  // absent = unset (inherits partition/global); 0 = no exemption
  uint32 max_submit_jobs_per_account = 16;
  uint32 grp_submit_jobs = 17;
  string flags = 18;
}

// ============================================================
// Job Steps
// ============================================================

message JobStepInfo {
  uint32 job_id = 1;
  uint32 step_id = 2;
  string name = 3;
  string state = 4;
  uint32 num_tasks = 5;
}

message GetJobStepsRequest {
  uint32 job_id = 1;
}

message GetJobStepsResponse {
  repeated JobStepInfo steps = 1;
}

message CreateJobStepRequest {
  uint32 job_id = 1;
  repeated string command = 2;
  uint32 num_tasks = 3;
  uint32 cpus_per_task = 4;
  bool overlap = 5;           // Share resources with existing step (--overlap)
  bool pty = 6;               // Allocate a PTY for the step
  WindowSize winsize = 7;     // Initial terminal dimensions
  string node = 8;            // Legacy single-node/PTY target; empty = first selected node
  string user = 9;            // Requesting user; verified identity must own the job; the controller/admin credential overrides
  uint32 uid = 10;            // Caller Unix uid for Munge-like ownership when unauthenticated; 0 = absent
  ContainerSpec container = 11;  // Step's own container request (empty image = none/inherit)
  uint32 num_nodes = 12;       // Explicit step node count (-N); 0 = use all allocated nodes
  string nodelist = 13;        // Exact step node subset (-w); empty = derive from num_nodes/allocation
}

message CreateJobStepResponse {
  uint32 step_id = 1;
  string node_addr = 2;        // Address of the first resolved step node; host:port for agent
  ContainerSpec container = 3; // Effective container for the step (step's own, else inherited from the job); empty image = host
}

message CompleteJobStepRequest {
  uint32 job_id = 1;
  uint32 step_id = 2;
  int32 exit_code = 3;
  string user = 4;            // Requesting user; verified identity must own the job; the controller/admin credential overrides
  uint32 uid = 5;             // Caller Unix uid for Munge-like ownership when unauthenticated; 0 = absent
}

// ============================================================
// Partition Management
// ============================================================

message CreatePartitionRequest {
  string name = 1;
  string nodes = 2;               // hostlist pattern; a node matches if it satisfies this OR selector
  map<string, string> selector = 3; // label selector; a node matches if it satisfies this OR nodes
  string state = 4;               // "UP" | "DOWN" | "DRAIN" | "INACTIVE" (default "UP")
  bool is_default = 5;
  string max_time = 6;            // e.g. "24:00:00" or "INFINITE" (empty = INFINITE)
  string default_time = 7;        // e.g. "01:00:00" (empty = no default)
  optional uint32 max_nodes = 8;
  uint32 min_nodes = 9;
  repeated string allow_accounts = 10;
  repeated string allow_groups = 11;
  uint32 priority_tier = 12;
  string preempt_mode = 13;       // "OFF" | "CANCEL" | "REQUEUE" | "SUSPEND"
  repeated string deny_accounts = 14;
  repeated string deny_qos = 15;
  repeated string allow_qos = 16;
  // Minimum seconds a job must run before it is eligible for preemption.
  // 0 = no exemption (immediately preemptable). Absent = use global default.
  optional uint32 preempt_exempt_time = 17;
}

message UpdatePartitionRequest {
  string name = 1;                // Required: partition to update
  optional string nodes = 2;
  map<string, string> selector = 3;     // replaces; empty = no change unless set_selector
  bool set_selector = 21;               // true = apply selector (even if empty, to clear it)
  optional string state = 4;
  optional bool is_default = 5;
  optional string max_time = 6;   // "INFINITE" clears the limit
  optional string default_time = 7;
  optional uint32 max_nodes_value = 8;  // 0 = clear limit
  bool clear_max_nodes = 9;
  optional uint32 min_nodes = 10;
  repeated string allow_accounts = 11;  // replaces; empty = no change
  bool set_allow_accounts = 12;         // true = apply allow_accounts (even if empty)
  repeated string allow_groups = 13;
  bool set_allow_groups = 14;
  optional uint32 priority_tier = 15;
  optional string preempt_mode = 16;
  // Minimum seconds a job must run before eligible for preemption.
  // 0 is a valid value meaning "immediately preemptable" (no exemption).
  // Absent = no change.
  optional uint32 preempt_exempt_time = 24;
  // Set to true to clear preempt_exempt_time back to NULL (inherit from global
  // default). Takes precedence over preempt_exempt_time.
  bool clear_preempt_exempt_time = 25;
  repeated string deny_accounts = 17;
  bool set_deny_accounts = 18;
  repeated string deny_qos = 19;
  bool set_deny_qos = 20;
  repeated string allow_qos = 22;
  bool set_allow_qos = 23;
}

message DeletePartitionRequest {
  string name = 1;
}

// ============================================================
// Reservation Management
//
// Create, update, and delete require an operator: a cluster admin, or a caller the controller
// resolves to uid 0 or a `sudo`/`wheel` member. The `user` fields below are overwritten with the
// authenticated name when a credential is presented, so they are only trusted without one.
// ============================================================

message CreateReservationRequest {
  string name = 1;
  string start_time = 2;      // ISO 8601 or "now"
  uint32 duration_minutes = 3;
  repeated string nodes = 4;
  repeated string accounts = 5;
  repeated string users = 6;
  repeated string flags = 7;
  string user = 8;            // requesting user; must be an operator, and is recorded as the owner
}

message UpdateReservationRequest {
  string name = 1;
  uint32 duration_minutes = 2;  // 0 = no change
  repeated string add_nodes = 3;
  repeated string remove_nodes = 4;
  repeated string add_users = 5;
  repeated string remove_users = 6;
  repeated string add_accounts = 7;
  repeated string remove_accounts = 8;
  string user = 9;              // requesting user; must be an operator, who may update any reservation
}

message DeleteReservationRequest {
  string name = 1;
  string user = 2;             // requesting user; must be an operator, who may delete any reservation
}

message ListReservationsRequest {
  string name = 1;  // empty = all
}

message ListReservationsResponse {
  repeated ReservationInfo reservations = 1;
}

message ReservationInfo {
  string name = 1;
  string start_time = 2;
  string end_time = 3;
  string nodes = 4;
  string accounts = 5;
  string users = 6;
  string flags = 7;
  string state = 8;
  string owner = 9;
}

// ============================================================
// Admission token management
// ============================================================

message CreateTokenRequest {
  optional uint32 ttl_secs = 1;    // Token lifetime in seconds (0 or absent = no expiry)
}

message CreateTokenResponse {
  string token = 1;      // Full <id>.<secret> token string (shown once)
  string token_id = 2;   // Short ID for reference in list/revoke
}

message ListTokensRequest {}

message ListTokensResponse {
  repeated TokenInfo tokens = 1;
}

message TokenInfo {
  string id = 1;
  string created_at = 2;       // RFC 3339
  string expires_at = 3;       // RFC 3339 or empty if no expiry
  bool revoked = 4;
}

message RevokeTokenRequest {
  string token_id = 1;
}

message RevokeTokenResponse {}
