apiVersion: v1
kind: Service
metadata:
  name: spurctld
  namespace: spur
spec:
  selector:
    app: spurctld
  ports:
    - name: grpc
      port: 6817
      targetPort: 6817
    - name: rest
      port: 6820
      targetPort: 6820
    - name: raft
      port: 6821
      targetPort: 6821
  clusterIP: None  # headless for StatefulSet peer DNS
  # Peer DNS must resolve BEFORE a pod is ready: the replicas need each other to
  # elect a leader, and readiness below waits for that leader. Without this the
  # two conditions deadlock and the cluster never starts.
  #
  # It also means this Service publishes replicas that are NOT ready, so it is
  # for peer discovery only. Clients use spurctld-client below, which honours
  # readiness and therefore drops a replica whose Raft is unhealthy.
  publishNotReadyAddresses: true
---
# Client entry point. Unlike the headless Service above, this one keeps a
# replica out while /readyz fails, which is the whole reason the probe reads
# Raft instead of a TCP port.
apiVersion: v1
kind: Service
metadata:
  name: spurctld-client
  namespace: spur
spec:
  selector:
    app: spurctld
  ports:
    - name: grpc
      port: 6817
      targetPort: 6817
    - name: rest
      port: 6820
      targetPort: 6820
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spurctld
  namespace: spur
spec:
  serviceName: spurctld
  # Fixed at first apply. Raising this later makes the new, empty replicas try to
  # form a second Raft cluster, and spurctld refuses to start rather than do it.
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: spurctld
  template:
    metadata:
      labels:
        app: spurctld
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: spurctld
          image: spur:latest
          command: [spurctld]
          args:
            - --listen=[::]:6817
            - --config=/etc/spur/spur.conf
          ports:
            - containerPort: 6817
              name: grpc
            - containerPort: 6820
              name: rest
            - containerPort: 6821
              name: raft
            - containerPort: 6823
              name: probes
          volumeMounts:
            - name: config
              mountPath: /etc/spur
            - name: spool
              mountPath: /var/spool/spur
          # A TCP probe on 6817 only proves the listener is up. RaftCore is a
          # separate task: when it dies the listener still accepts connections,
          # so the replica served stale reads and failed every write while
          # Kubernetes reported it healthy. These read Raft instead.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6823
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 6823
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: spur-config
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
